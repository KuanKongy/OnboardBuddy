services:
  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    env_file:
      - backend/.env
    environment:
      # DATABASE_URL is the transaction-mode pooler: clients multiplex, so
      # each process sizes its pool for its own fan-out
      # (doc/DEVOPS.md "Connection pooling").
      PG_POOL_MAX: 10
    volumes:
      - ./backend/github-app.pem:/app/backend/github-app.pem:ro
    ports:
      - "3000:3000"

  # Horizontally scalable: `docker compose up -d --scale backend-worker=N`.
  # BullMQ distributes jobs across replicas; heartbeats and the kill-switch
  # are per-job row guards, so replicas never fight over a run.
  backend-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - backend/.env
    # Graceful shutdown needs room: on SIGTERM the worker stops taking new jobs
    # and finishes what it holds (WORKER_SHUTDOWN_GRACE_MS, default 25s). At
    # Docker's 10s default the container was SIGKILLed mid-drain, which is the
    # orphaning this is meant to prevent. Must stay > the app-level grace.
    stop_grace_period: 30s
    environment:
      # Per-replica knobs (see doc/DEVOPS.md "Scaling workers"). These override
      # backend/.env — a compose `environment:` entry always wins over
      # `env_file`, which is why the worker ran on PG_POOL_MAX=10 while
      # backend/.env said 20.
      #
      # Both workers run in THIS one process (worker/index.ts imports
      # summaryWorker.js), so the pool serves 4 analyses + 4 generations.
      # Arithmetic for the 30: backend/src/lib/db.ts.
      PG_POOL_MAX: 30
      WORKER_CONCURRENCY: 4     # parallel analysis runs per replica
      SUMMARY_CONCURRENCY: 4    # parallel package generations per replica
      # Also available (defaults in code): SECTION_CONCURRENCY (12, sections in
      # parallel within one generation) and LLM_MAX_CONCURRENCY (12, provider
      # calls per AiClient — i.e. PER RUN, so 4 runs burst 4x that at
      # OpenRouter; there is no global cross-run LLM limiter).
    volumes:
      - ./backend/github-app.pem:/app/backend/github-app.pem:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # Same frontend/.env the setup instructions already ask for — but read at
    # CONTAINER START now, not baked into the image by Vite at build time
    # (issue #73, doc/DEVOPS.md "Runtime configuration"). The startup script
    # turns VITE_API_URL / VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY into
    # /config.js and into the CSP's connect-src. Two consequences worth
    # knowing: editing frontend/.env now takes effect on `docker compose up -d
    # frontend` with no --build, and the same image can serve a Railway
    # deployment. Nothing else in this file is published to the browser — the
    # script reads exactly those three names.
    env_file:
      - frontend/.env
    ports:
      - "5173:80"
    depends_on:
      - backend-api

# Automated tests live in docker-compose.test.yml:
#   docker compose -f docker-compose.test.yml run --rm test
