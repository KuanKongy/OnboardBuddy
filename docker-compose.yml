services:
  backend-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    env_file:
      - backend/.env
    environment:
      # API + worker pools share Supabase's session-mode pool_size (15):
      # 4 + 8 stays under the cap (doc/DEVOPS.md "Connection pooling").
      PG_POOL_MAX: 4
    volumes:
      - ./backend/github-app.pem:/app/backend/github-app.pem:ro
    ports:
      - "3000:3000"

  backend-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    env_file:
      - backend/.env
    environment:
      PG_POOL_MAX: 8
    volumes:
      - ./backend/github-app.pem:/app/backend/github-app.pem:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend-api

# Automated tests live in docker-compose.test.yml:
#   docker compose -f docker-compose.test.yml run --rm test
