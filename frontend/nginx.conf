server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers. Repeated in every location that sets its own header:
  # nginx replaces, rather than merges, inherited `add_header` directives —
  # see the comment block in security-headers.conf.
  include /etc/nginx/security-headers.conf;

  # index.html must never be heuristically cached: a cached copy can
  # reference hashed chunks deleted by the next deploy (blank page until a
  # hard refresh). The chunks themselves are content-hashed, so they are
  # safe to cache forever.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Unhashed (it ships from public/), so it gets index.html's caching rule
  # rather than the immutable one — otherwise a stale copy could outlive a
  # change to the theme bootstrap.
  location = /bootstrap.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
