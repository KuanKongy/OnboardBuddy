<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OnboardBuddy</title>
    <meta
      name="description"
      content="OnboardBuddy analyzes a repository and generates role-aware onboarding documentation with every claim linked to the code it came from."
    />
    <!-- Browser UI colour per scheme. Hexes are the current `--background`
         tokens converted from OKLCH (frontend/src/styles.css); a token change
         has to be mirrored here. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0f16" />
    <!--
      Deployment configuration (API origin, Supabase project + anon key). In a
      container this file is regenerated from the environment at startup, which
      is what lets one image serve any API origin (issue #73); locally it is the
      empty placeholder from public/ and the app reads frontend/.env instead.

      Classic, synchronous, same-origin script element: it executes before the
      deferred module below, so the values are there on the app's first line —
      no boot fetch, no round trip, and nothing to inline (the CSP stays
      `script-src 'self'`). See frontend/src/lib/runtimeConfig.ts.
    -->
    <script src="/config.js"></script>
    <!--
      Theme/font-size bootstrap. External and synchronous: it must run before
      first paint, and keeping it out of the HTML is what lets the CSP be
      `script-src 'self'` with no 'unsafe-inline' and no hash to maintain
      (doc/SECURITY_XSS_PROMPT_INJECTION.md §5.1). Do not inline this back.
    -->
    <script src="/bootstrap.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
